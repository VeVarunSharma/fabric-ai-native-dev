name: Validate Fabric pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Capture pull request context
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Enforce Fabric review policy
        run: |
          set -o pipefail
          python scripts/validate_repo_policy.py \
            --changed-files-file "$RUNNER_TEMP/changed-files.txt" \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            | tee "$RUNNER_TEMP/policy-summary.txt"
          {
            echo "## Fabric policy validation"
            echo '```text'
            cat "$RUNNER_TEMP/policy-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check scripts tests

      - name: Run type checks
        run: python -m mypy scripts tests
