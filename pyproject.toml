[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-copilot-demo"
version = "0.1.0"
description = "A low-DevOps Microsoft Fabric Git and deployment demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.25,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
deploy = [
  "fabric-cicd==1.3.0",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-requests>=2.32,<3",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "tests"]
strict = true
